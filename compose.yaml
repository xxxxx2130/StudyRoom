services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolroom
      POSTGRES_USER: schoolroom
      POSTGRES_PASSWORD: schoolroom_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolroom -d schoolroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
